# Paths are resolved against the uav_stitching project root.
images_dir: ../image
mrk_file: ../image/information.MRK
rtk_file: ../image/information.RTK
nav_file: ../image/information.NAV
obs_file: ../image/information.OBS

output_dir: outputs
cache_dir: cache
debug_dir: debug

gps:
  coordinate_system: enu
  neighbor_method: quadrant
  max_neighbor_distance_m: null
  knn_k: 4

features:
  method: sift
  nfeatures: 8000
  ratio_test: 0.75
  ransac_threshold_px: 4.0
  min_inliers: 20

sampling:
  method: uniform
  selected_points: 40
  grid_rows: 5
  grid_cols: 8
  random_seed: 42

optimization:
  reference_image: auto
  sigma_tr: 5000.0
  rigid_weight: 800.0
  max_nfev_affine: 200
  max_nfev_projective: 300
  verbose: 2

warp:
  preview_scale: 0.15
  final_scale: 0.25
  max_final_pixels: 50000000

blend:
  method: graphcut
  frame_to_frame: true
  exposure_compensation: false
  seam_scale: 0.10
