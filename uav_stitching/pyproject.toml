[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-paper-stitching"
version = "0.1.0"
description = "Engineering reproduction of large-scale UAV image stitching"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "opencv-contrib-python>=4.8",
  "Pillow>=10",
  "PyYAML>=6",
  "tqdm>=4.66",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
